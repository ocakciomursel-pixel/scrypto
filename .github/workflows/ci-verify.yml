name: Verify Scrypto 89
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scala: [3.3.5, 2.13.16, 2.12.20, 2.11.12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      - uses: sbt/setup-sbt@v1
      - name: Run AVLBatchSerializationSpecification
        run: sbt "++${{ matrix.scala }}" "scryptoJVM/testOnly scorex.crypto.authds.avltree.batch.serialization.AVLBatchSerializationSpecification"
